<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Uaddara Basic School SBA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .icon-circle {
      width: 72px;
      height: 72px;
      background: #fef3c7;
      color: #d97706;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.925rem;
      color: #64748b;
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #9633cc;
      color: #ffffff;
      padding: 0.75rem 1.75rem;
      border-radius: 0.625rem;
      font-weight: 700;
      font-size: 0.925rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn-retry:hover { background: #7c22ab; }
    .btn-retry:active { transform: scale(0.98); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 1.25rem;
      font-weight: 600;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="36" height="36">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.657a9 9 0 01-2.121-4.243m1.414-5.657a9 9 0 0112.728 0m-8.485 1.414a5 5 0 017.072 0m-2.829 2.829L3 3" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>Please check your Wi-Fi or mobile data connection. Your assessment data is safe, and the system will automatically reconnect as soon as your internet is restored.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Try Reconnecting
    </button>
    <div class="status-badge">
      <span class="pulse-dot"></span> Waiting for network...
    </div>
  </div>

  <script>
    // Automatically reload when network reconnects
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
